<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9f1">
<title>Чикава — уход за питомцем</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div id="title">Чикава <small id="age"></small></div>
    <button id="sound" class="icon" aria-label="Звук">🔊</button>
  </header>

  <section id="stats">
    <div class="stat"><span>🍙</span><i><b id="s-hunger"></b></i></div>
    <div class="stat"><span>💖</span><i><b id="s-fun"></b></i></div>
    <div class="stat"><span>⚡</span><i><b id="s-energy"></b></i></div>
    <div class="stat"><span>🫧</span><i><b id="s-clean"></b></i></div>
  </section>

  <div id="stage"><canvas id="c"></canvas><div id="msg"></div></div>

  <nav id="actions">
    <button data-act="feed"><em>🍙</em>Кормить</button>
    <button data-act="play"><em>🎾</em>Играть</button>
    <button data-act="wash"><em>🛁</em>Мыть</button>
    <button data-act="sleep"><em>🌙</em>Спать</button>
  </nav>
</main>
<script src="game.js"></script>
</body>
</html>
